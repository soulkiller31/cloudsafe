<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30GB Claimed — CloudSafe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #34A853; --blue: #4285F4;
      --dark: #0f0f1a; --card: #1e1e35;
      --border: rgba(255,255,255,0.08);
      --text: #e8eaf6; --muted: #8892b0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark); color: var(--text);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 50% 0%, rgba(52,168,83,0.2) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 10% 100%, rgba(66,133,244,0.1) 0%, transparent 50%),
        radial-gradient(ellipse 40% 40% at 90% 100%, rgba(251,188,4,0.08) 0%, transparent 50%);
    }

    /* confetti */
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .dot {
      position: absolute;
      border-radius: 50%;
      animation: fall linear infinite;
    }

    .card {
      position: relative; z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 56px 48px;
      max-width: 480px; width: 100%;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      animation: fadeUp 0.6s ease;
    }

    .check-circle {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(135deg, #34A853, #1e7e34);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      font-size: 2.6rem;
      box-shadow: 0 0 0 0 rgba(52,168,83,0.4);
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: 2.2rem; font-weight: 800; margin-bottom: 10px;
      background: linear-gradient(135deg, #34A853, #4285F4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1rem; color: var(--muted);
      line-height: 1.7; margin-bottom: 36px;
    }

    /* user bar */
    .user-bar {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 18px;
      margin-bottom: 28px; text-align: left;
    }
    .user-bar img {
      width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid var(--green); flex-shrink: 0;
    }
    .user-name  { font-weight: 600; font-size: 0.95rem; }
    .user-email { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    /* storage block */
    .storage-block {
      background: rgba(52,168,83,0.08);
      border: 1px solid rgba(52,168,83,0.25);
      border-radius: 16px; padding: 22px 24px;
      margin-bottom: 28px;
    }
    .storage-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .storage-label { font-size: 0.85rem; font-weight: 600; color: var(--green); }
    .storage-size  { font-size: 1.6rem; font-weight: 800; }
    .progress-track {
      height: 10px; background: rgba(255,255,255,0.08);
      border-radius: 10px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #34A853, #4285F4);
      border-radius: 10px;
      animation: fillBar 1.8s ease 0.4s both;
    }
    .storage-note {
      font-size: 0.75rem; color: var(--muted);
      margin-top: 10px; text-align: left;
      display: flex; align-items: center; gap: 6px;
    }

    /* what's being backed up — simple pill list, no status */
    .backed-list {
      display: flex; justify-content: center; gap: 12px;
      flex-wrap: wrap; margin-bottom: 32px;
    }
    .backed-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px; border-radius: 30px;
      font-size: 0.83rem; font-weight: 500;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
    }

    .signout {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.83rem; color: var(--muted);
      text-decoration: none; transition: color 0.2s;
    }
    .signout:hover { color: var(--text); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(52,168,83,0.5); }
      70%  { box-shadow: 0 0 0 22px rgba(52,168,83,0);   }
      100% { box-shadow: 0 0 0 0   rgba(52,168,83,0);   }
    }
    @keyframes fillBar {
      from { width: 0%; }
      to   { width: 100%; }
    }
    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(400deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="confetti" id="confetti"></div>

<div class="card">
  <div class="check-circle">🎉</div>

  <h1>30 GB Claimed!</h1>
  <p class="subtitle">
    Your free backup storage is active. Your photos and contacts<br>are being secured automatically.
  </p>

  <!-- User -->
  <div class="user-bar">
    <img id="userAvatar" src="" alt="avatar"
      onerror="this.src='https://ui-avatars.com/api/?name=U&background=4285F4&color=fff'" />
    <div>
      <div class="user-name"  id="userName">Loading...</div>
      <div class="user-email" id="userEmail">...</div>
    </div>
  </div>

  <!-- Storage -->
  <div class="storage-block">
    <div class="storage-top">
      <span class="storage-label"><i class="fas fa-hard-drive"></i> Free Storage</span>
      <span class="storage-size">30 GB</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="storage-note">
      <i class="fas fa-circle-check" style="color:var(--green)"></i>
      Storage is active and ready
    </div>
  </div>

  <!-- What's backed up — clean pills, no status -->
  <div class="backed-list">
    <div class="backed-pill">🖼️ Google Photos</div>
    <div class="backed-pill">👥 Contacts</div>
  </div>

  <a href="/auth/logout" class="signout">
    <i class="fas fa-right-from-bracket"></i> Sign out
  </a>
</div>

<script>
  // Load user info
  fetch('/auth/status').then(r => r.json()).then(data => {
    if (!data.loggedIn) return window.location.href = '/';
    document.getElementById('userName').textContent  = data.user.name;
    document.getElementById('userEmail').textContent = data.user.email;
    if (data.user.avatar) document.getElementById('userAvatar').src = data.user.avatar;
  });

  // Confetti
  const colors = ['#4285F4','#34A853','#FBBC04','#EA4335','#a78bfa','#34d399'];
  const container = document.getElementById('confetti');
  for (let i = 0; i < 45; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.cssText = `
      left: ${Math.random() * 100}%;
      width: ${4 + Math.random() * 8}px;
      height: ${4 + Math.random() * 8}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-duration: ${3 + Math.random() * 5}s;
      animation-delay: ${Math.random() * 4}s;
    `;
    container.appendChild(d);
  }
</script>
</body>
</html>
