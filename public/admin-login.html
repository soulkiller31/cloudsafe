<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — CloudSafe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark: #0f0f1a; --dark2: #1a1a2e; --card: #1e1e35;
      --border: rgba(255,255,255,0.08); --text: #e8eaf6; --muted: #8892b0;
      --red: #EA4335; --blue: #4285F4;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(234,67,53,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 100%, rgba(66,133,244,0.1) 0%, transparent 50%);
    }

    .login-box {
      width: 100%; max-width: 420px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 48px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      animation: fadeUp 0.5s ease;
    }

    .login-logo {
      text-align: center; margin-bottom: 32px;
    }
    .login-logo .icon {
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, #EA4335, #c62828);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.8rem; margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(234,67,53,0.3);
    }
    .login-logo h1 { font-size: 1.5rem; font-weight: 700; }
    .login-logo p { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input {
      width: 100%; padding: 13px 16px;
      background: var(--dark2); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 0.9rem;
      font-family: inherit; outline: none; transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--red); }
    .form-input::placeholder { color: var(--muted); }

    .input-wrapper { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.9rem; pointer-events: none; }
    .input-wrapper .form-input { padding-left: 42px; }
    .toggle-pass { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); cursor: pointer; font-size: 0.9rem; }
    .toggle-pass:hover { color: var(--text); }

    .btn-login {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #EA4335, #c62828);
      color: #fff; font-size: 0.95rem; font-weight: 600;
      border: none; border-radius: 12px; cursor: pointer;
      transition: all 0.2s ease; margin-top: 8px;
      font-family: inherit;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(234,67,53,0.4); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-msg {
      background: rgba(234,67,53,0.1); border: 1px solid rgba(234,67,53,0.3);
      color: #ff7b72; padding: 12px 16px; border-radius: 10px;
      font-size: 0.85rem; margin-bottom: 20px; display: none;
      align-items: center; gap: 8px;
    }
    .error-msg.show { display: flex; }

    .back-link {
      display: block; text-align: center; margin-top: 24px;
      font-size: 0.83rem; color: var(--muted); text-decoration: none;
    }
    .back-link:hover { color: var(--text); }

    .admin-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(234,67,53,0.1); border: 1px solid rgba(234,67,53,0.25);
      color: #ff7b72; padding: 4px 12px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 12px;
    }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="login-box">
  <div class="login-logo">
    <div class="icon">🛡️</div>
    <div class="admin-badge"><i class="fas fa-lock"></i> Admin Access</div>
    <h1>Admin Panel</h1>
    <p>CloudSafe — Private Control Center</p>
  </div>

  <div class="error-msg" id="errorMsg">
    <i class="fas fa-triangle-exclamation"></i>
    <span id="errorText">Invalid credentials</span>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">Username</label>
      <div class="input-wrapper">
        <i class="fas fa-user input-icon"></i>
        <input class="form-input" type="text" id="username" placeholder="admin" autocomplete="username" required />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrapper">
        <i class="fas fa-key input-icon"></i>
        <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
        <span class="toggle-pass" onclick="togglePassword()"><i class="fas fa-eye" id="eyeIcon"></i></span>
      </div>
    </div>

    <button class="btn-login" type="submit" id="loginBtn">
      Sign In to Admin Panel
    </button>
  </form>

  <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to main site</a>
</div>

<script>
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('errorMsg');
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';

    try {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (data.success) {
        btn.innerHTML = '<i class="fas fa-check"></i> Success!';
        window.location.href = data.redirect || '/admin/dashboard';
      } else {
        document.getElementById('errorText').textContent = data.error || 'Invalid credentials';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Sign In to Admin Panel';
      }
    } catch (err) {
      document.getElementById('errorText').textContent = 'Connection error. Try again.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = 'Sign In to Admin Panel';
    }
  }

  function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fas fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'fas fa-eye';
    }
  }
</script>
</body>
</html>
