<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backup Items — CloudSafe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:#4285F4;--green:#34A853;--yellow:#FBBC04;--red:#EA4335;
      --dark:#0f0f1a;--dark2:#1a1a2e;--card:#1e1e35;
      --border:rgba(255,255,255,0.08);--text:#e8eaf6;--muted:#8892b0;
    }
    body { font-family:'Inter',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; padding:32px; }
    .back-btn { display:inline-flex; align-items:center; gap:8px; color:var(--muted); text-decoration:none; font-size:0.9rem; margin-bottom:24px; transition:color 0.2s; }
    .back-btn:hover { color:var(--text); }
    .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; flex-wrap:wrap; gap:16px; }
    .page-header h1 { font-size:1.8rem; font-weight:700; display:flex; align-items:center; gap:12px; }
    .header-meta { font-size:0.85rem; color:var(--muted); margin-top:4px; }
    .btn { padding:10px 20px; border-radius:10px; font-size:0.85rem; font-weight:500; border:none; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; gap:8px; }
    .btn-primary { background:var(--blue); color:#fff; }
    .btn-primary:hover { background:#3574e2; }

    /* Tabs */
    .tabs { display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--border); padding-bottom:0; }
    .tab { padding:10px 18px; border-radius:10px 10px 0 0; font-size:0.875rem; font-weight:500; cursor:pointer; color:var(--muted); border:none; background:none; transition:all 0.2s; }
    .tab.active { color:var(--blue); border-bottom:2px solid var(--blue); }

    /* Grid / List */
    .items-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:16px; }
    .item-card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; transition:all 0.2s; cursor:pointer; }
    .item-card:hover { transform:translateY(-3px); border-color:rgba(66,133,244,0.3); }
    .item-thumb { width:100%; aspect-ratio:1; background:var(--dark2); display:flex; align-items:center; justify-content:center; font-size:2rem; overflow:hidden; }
    .item-thumb img { width:100%; height:100%; object-fit:cover; }
    .item-info { padding:10px; }
    .item-name { font-size:0.75rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .item-meta { font-size:0.7rem; color:var(--muted); margin-top:2px; }

    .items-list { display:flex; flex-direction:column; gap:8px; }
    .list-item { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; display:flex; align-items:center; gap:14px; transition:all 0.2s; }
    .list-item:hover { border-color:rgba(66,133,244,0.3); }
    .list-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
    .list-info { flex:1; min-width:0; }
    .list-name { font-size:0.875rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .list-meta { font-size:0.75rem; color:var(--muted); margin-top:3px; }
    .list-date { font-size:0.75rem; color:var(--muted); flex-shrink:0; }

    /* Search */
    .search-bar { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .search-input { flex:1; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 16px; color:var(--text); font-size:0.875rem; outline:none; font-family:inherit; }
    .search-input:focus { border-color:var(--blue); }
    .search-input::placeholder { color:var(--muted); }

    /* Pagination */
    .pagination { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:24px; }
    .page-btn { width:36px; height:36px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:0.8rem; transition:all 0.2s; }
    .page-btn:hover, .page-btn.active { background:var(--blue); border-color:var(--blue); }
    .page-info { font-size:0.8rem; color:var(--muted); padding:0 8px; }

    .empty-state { text-align:center; padding:80px 20px; }
    .empty-state .empty-icon { font-size:4rem; margin-bottom:16px; }
    .empty-state h3 { font-size:1.2rem; font-weight:600; margin-bottom:8px; }
    .empty-state p { color:var(--muted); font-size:0.9rem; }

    .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .toast { position:fixed; bottom:24px; right:24px; padding:14px 20px; border-radius:12px; font-size:0.875rem; font-weight:500; display:none; z-index:500; align-items:center; gap:10px; box-shadow:0 8px 32px rgba(0,0,0,0.4); }
    .toast.show { display:flex; }
    .toast.success { background:rgba(52,168,83,0.9); color:#fff; }
    .toast.error { background:rgba(234,67,53,0.9); color:#fff; }
    .toast.info { background:rgba(66,133,244,0.9); color:#fff; }
  </style>
</head>
<body>

<a href="/dashboard" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

<div class="page-header">
  <div>
    <h1 id="pageTitle"><span id="pageIcon">📁</span> <span id="pageLabel">Backup</span></h1>
    <div class="header-meta" id="headerMeta">Loading...</div>
  </div>
  <div style="display:flex;gap:10px">
    <button class="btn btn-primary" id="btnRunBackup" onclick="runBackup()">
      <i class="fas fa-cloud-arrow-up"></i> Run Backup
    </button>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" onclick="switchView('grid', this)"><i class="fas fa-grid-2"></i> Grid</button>
  <button class="tab" onclick="switchView('list', this)"><i class="fas fa-list"></i> List</button>
</div>

<!-- Search -->
<div class="search-bar">
  <input class="search-input" id="searchInput" placeholder="Search backed up items..." oninput="filterItems()" />
</div>

<!-- Items Container -->
<div id="itemsContainer"></div>

<!-- Pagination -->
<div class="pagination" id="pagination"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const TYPE_META = {
  photos:   { label:'Google Photos', icon:'🖼️', color:'#4285F4', bg:'rgba(66,133,244,0.15)' },
  gmail:    { label:'Gmail',          icon:'📧', color:'#EA4335', bg:'rgba(234,67,53,0.15)' },
  drive:    { label:'Google Drive',   icon:'📁', color:'#34A853', bg:'rgba(52,168,83,0.15)' },
  contacts: { label:'Contacts',       icon:'👥', color:'#FBBC04', bg:'rgba(251,188,4,0.15)' }
};

const type = window.location.pathname.split('/').pop();
const meta = TYPE_META[type] || { label: type, icon: '📦', color: '#4285F4', bg: 'rgba(66,133,244,0.15)' };
let currentView = 'grid';
let currentPage = 1;
let allItems = [];
let filtered = [];

document.getElementById('pageIcon').textContent = meta.icon;
document.getElementById('pageLabel').textContent = meta.label;

async function loadItems(page = 1) {
  document.getElementById('itemsContainer').innerHTML = '<div style="text-align:center;padding:60px"><span class="spinner"></span></div>';
  try {
    const res = await fetch(`/api/backup-items/${type}?page=${page}`);
    const data = await res.json();
    allItems = data.items || [];
    filtered = allItems;
    currentPage = data.page;
    const backup = data.backup || {};
    document.getElementById('headerMeta').textContent =
      `${data.total.toLocaleString()} items backed up · Last synced: ${backup.last_synced ? new Date(backup.last_synced).toLocaleString() : 'Never'}`;
    renderItems(filtered);
    renderPagination(data.total, page);
  } catch(err) {
    document.getElementById('itemsContainer').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Failed to load</h3><p>${err.message}</p></div>`;
  }
}

function renderItems(items) {
  const container = document.getElementById('itemsContainer');
  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">${meta.icon}</div><h3>No items backed up yet</h3><p>Click "Run Backup" to back up your ${meta.label}.</p></div>`;
    return;
  }

  if (currentView === 'grid') {
    container.innerHTML = `<div class="items-grid">${items.map(item => renderGridCard(item)).join('')}</div>`;
  } else {
    container.innerHTML = `<div class="items-list">${items.map(item => renderListItem(item)).join('')}</div>`;
  }
}

function renderGridCard(item) {
  let metaData = {};
  try { metaData = JSON.parse(item.metadata || '{}'); } catch(e) {}

  if (type === 'photos' && metaData.baseUrl) {
    return `<div class="item-card"><div class="item-thumb"><img src="${metaData.baseUrl}=w200-h200-c" onerror="this.parentNode.innerHTML='🖼️'" loading="lazy"/></div><div class="item-info"><div class="item-name">${item.name || 'Photo'}</div><div class="item-meta">${metaData.mimeType || ''}</div></div></div>`;
  }

  const icons = { photos:'🖼️', gmail:'📧', drive:'📁', contacts:'👥' };
  const subtexts = {
    gmail: metaData.threadId ? `Thread: ${metaData.threadId.slice(0,8)}...` : '',
    drive: metaData.mimeType || '',
    contacts: (metaData.phones || []).join(', ') || (metaData.emails || []).join(', ') || ''
  };

  return `<div class="item-card">
    <div class="item-thumb" style="background:${meta.bg}">${icons[type] || '📦'}</div>
    <div class="item-info">
      <div class="item-name">${item.name || item.item_id}</div>
      <div class="item-meta">${subtexts[type] || ''}</div>
    </div>
  </div>`;
}

function renderListItem(item) {
  let metaData = {};
  try { metaData = JSON.parse(item.metadata || '{}'); } catch(e) {}
  const icons = { photos:'🖼️', gmail:'📧', drive:'📁', contacts:'👥' };
  const date = item.backed_up_at ? new Date(item.backed_up_at).toLocaleDateString() : '';
  let subtext = '';
  if (type === 'contacts') subtext = (metaData.phones || []).join(', ') || (metaData.emails || [])[0] || '';
  if (type === 'gmail') subtext = metaData.subject || '';
  if (type === 'drive') subtext = metaData.mimeType || '';

  return `<div class="list-item">
    <div class="list-icon" style="background:${meta.bg}">${icons[type]}</div>
    <div class="list-info">
      <div class="list-name">${item.name || item.item_id}</div>
      <div class="list-meta">${subtext}</div>
    </div>
    <div class="list-date">${date}</div>
  </div>`;
}

function renderPagination(total, page) {
  const totalPages = Math.ceil(total / 50);
  if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
  let html = '';
  if (page > 1) html += `<button class="page-btn" onclick="loadItems(${page-1})"><i class="fas fa-chevron-left"></i></button>`;
  for (let i = Math.max(1, page-2); i <= Math.min(totalPages, page+2); i++) {
    html += `<button class="page-btn ${i===page?'active':''}" onclick="loadItems(${i})">${i}</button>`;
  }
  if (page < totalPages) html += `<button class="page-btn" onclick="loadItems(${page+1})"><i class="fas fa-chevron-right"></i></button>`;
  html += `<span class="page-info">Page ${page} of ${totalPages}</span>`;
  document.getElementById('pagination').innerHTML = html;
}

function filterItems() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  filtered = allItems.filter(item => (item.name || '').toLowerCase().includes(q) || (item.item_id || '').toLowerCase().includes(q));
  renderItems(filtered);
}

function switchView(view, btn) {
  currentView = view;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderItems(filtered);
}

async function runBackup() {
  const btn = document.getElementById('btnRunBackup');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Running...';
  showToast(`Backing up ${meta.label}...`, 'info');

  try {
    const res = await fetch(`/api/${type}/backup`, { method: 'POST' });
    const data = await res.json();
    if (data.success) {
      showToast(`Done! ${data.count} items backed up.`, 'success');
      loadItems(1);
    } else throw new Error(data.error);
  } catch(err) {
    showToast('Backup failed: ' + err.message, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-cloud-arrow-up"></i> Run Backup';
}

function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 3500);
}

loadItems(1);
</script>
</body>
</html>
